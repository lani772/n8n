name: AI Workflow Architect CI
on:
  push:
    branches: [ai-workflow-architect]
    paths:
      - 'apps/ai-workflow-architect/**'
      - '.github/workflows/ai-workflow-architect-ci.yml'
  pull_request:
    paths:
      - 'apps/ai-workflow-architect/**'
      - '.github/workflows/ai-workflow-architect-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-workflow-architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          test -f docker/postgres-init.sh
          test -f docker/mongo-init.js
          docker compose config --quiet
      - name: Start services and run integration smoke tests
        run: |
          set -eu
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --detach --wait --wait-timeout 360 || {
            docker compose ps
            docker compose logs --no-color --tail=150
            exit 1
          }
          curl --fail --silent --show-error http://localhost:3000/health/live
          curl --fail --silent --show-error http://localhost:3000/health/ready
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/api/v1/workflows)"
          test "$status" = "401"
          table="$(docker compose exec -T postgres psql -U n8n -d architect -Atc "SELECT to_regclass('public.architect_workflows')")"
          test "$table" = "architect_workflows"
          docker compose exec -T postgres psql -U n8n -d architect -v ON_ERROR_STOP=1 -c "INSERT INTO architect_workflows (workflow_id,user_id,session_id,name,draft_hash,status,requirements) VALUES ('ci-user-a','ci-user-a','10000000-0000-4000-8000-000000000001','User A workflow',repeat('a',64),'created_inactive','{}'::jsonb),('ci-user-b','ci-user-b','10000000-0000-4000-8000-000000000002','User B workflow',repeat('b',64),'created_inactive','{}'::jsonb)"
          docker compose exec -T postgres psql -U n8n -d architect -v ON_ERROR_STOP=1 -c "INSERT INTO architect_deployments (user_id,session_id,draft_hash,status,workflow_id,name,requirements) VALUES ('ci-user-a','10000000-0000-4000-8000-000000000001',repeat('a',64),'created_inactive','ci-user-a','User A deployment','{}'::jsonb),('ci-user-b','10000000-0000-4000-8000-000000000002',repeat('b',64),'created_inactive','ci-user-b','User B deployment','{}'::jsonb)"
          JWT_SECRET="$(grep '^JWT_SECRET=' .env | cut -d= -f2-)" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { SignJWT } from 'jose';
          const secret = new TextEncoder().encode(process.env.JWT_SECRET);
          const token = await new SignJWT({}).setProtectedHeader({ alg: 'HS256' }).setIssuer('ai-workflow-architect').setAudience('ai-workflow-architect-api').setSubject('ci-user-a').setIssuedAt().setExpirationTime('2m').sign(secret);
          const response = await fetch('http://localhost:3000/api/v1/workflows', { headers: { authorization: `Bearer ${token}` } });
          assert.equal(response.status, 200, 'authenticated workflow listing should succeed');
          const body = await response.json();
          assert.deepEqual(body.workflows.map((workflow) => workflow.user_id), ['ci-user-a'], 'workflow listing must exclude other users');
          assert.deepEqual(body.workflows.map((workflow) => workflow.workflow_id), ['ci-user-a']);

          const ownDeployment = await fetch('http://localhost:3000/api/v1/chat/10000000-0000-4000-8000-000000000001/deployment', { headers: { authorization: `Bearer ${token}` } });
          assert.equal(ownDeployment.status, 200, 'owner should be able to read their deployment status');
          const ownBody = await ownDeployment.json();
          assert.equal(ownBody.name, 'User A deployment');
          assert.equal(ownBody.nextAction, 'workflow_created_inactive');

          const otherDeployment = await fetch('http://localhost:3000/api/v1/chat/10000000-0000-4000-8000-000000000002/deployment', { headers: { authorization: `Bearer ${token}` } });
          assert.equal(otherDeployment.status, 404, 'API must hide another user deployment');
          assert.deepEqual(await otherDeployment.json(), { error: 'Deployment record not found' });
          console.log('Authenticated workflow and deployment tenant isolation passed.');
          NODE
          echo "Integration smoke tests passed: API health, dependency readiness, auth gate, PostgreSQL schema, workflow and deployment tenant isolation."
