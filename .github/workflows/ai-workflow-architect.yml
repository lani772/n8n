name: AI Workflow Architect

on:
  push:
    branches: [ai-workflow-architect]
    paths:
      - 'apps/ai-workflow-architect/**'
      - '.github/workflows/ai-workflow-architect.yml'
  pull_request:
    paths:
      - 'apps/ai-workflow-architect/**'
      - '.github/workflows/ai-workflow-architect.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-workflow-architect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ai-workflow-architect/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
